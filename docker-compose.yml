version: '3.8'
services:
  bot:
    build: ./bot
    ports:
      - "8080:8080"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS}
      - WEBAPP_URL=${WEBAPP_URL}
      - DATABASE_URL=/data/blaze.db
    volumes:
      - bot-data:/data
    restart: unless-stopped

volumes:
  bot-data:
